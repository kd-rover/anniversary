<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activity Log - Kishoreganj District Rover</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #8B0000 0%, #CC0000 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .log-container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }
        .log-header h1 {
            color: #333;
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .log-header h1 i {
            color: #8B0000;
        }
        .back-btn {
            padding: 12px 24px;
            background: #8B0000;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
            text-decoration: none;
        }
        .back-btn:hover {
            background: #CC0000;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(139, 0, 0, 0.3);
        }
        .log-stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .stat-card {
            background: #f8f9fa;
            padding: 15px 25px;
            border-radius: 12px;
            border-left: 4px solid #8B0000;
            flex: 1;
            min-width: 150px;
        }
        .stat-card .number {
            font-size: 28px;
            font-weight: 700;
            color: #8B0000;
        }
        .stat-card .label {
            font-size: 14px;
            color: #666;
            margin-top: 4px;
        }
        .filters {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
        }
        .filters select,
        .filters input {
            padding: 8px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            flex: 1;
            min-width: 150px;
        }
        .filters select:focus,
        .filters input:focus {
            border-color: #8B0000;
            outline: none;
        }
        .filters .filter-btn {
            padding: 8px 20px;
            background: #8B0000;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .filters .filter-btn:hover {
            background: #CC0000;
        }
        .filters .clear-btn {
            padding: 8px 20px;
            background: #e0e0e0;
            color: #333;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .filters .clear-btn:hover {
            background: #cccccc;
        }
        .activity-log-list {
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            background: #fafafa;
        }
        .activity-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            transition: background 0.2s;
        }
        .activity-item:hover {
            background: #f0f0f0;
        }
        .activity-item:last-child {
            border-bottom: none;
        }
        .activity-item .activity-user {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            min-width: 200px;
        }
        .activity-item .activity-user strong {
            color: #8B0000;
        }
        .activity-item .activity-user .position-badge {
            background: #e8f0fe;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 11px;
            color: #1a73e8;
        }
        .activity-item .activity-action {
            color: #333;
            flex: 1;
            padding: 0 15px;
        }
        .activity-item .activity-time {
            color: #999;
            font-size: 12px;
            white-space: nowrap;
            min-width: 120px;
            text-align: right;
        }
        .activity-empty {
            text-align: center;
            padding: 50px 20px;
            color: #999;
        }
        .activity-empty i {
            font-size: 48px;
            margin-bottom: 15px;
            color: #ddd;
        }
        .loading {
            text-align: center;
            padding: 50px 20px;
            display: none;
        }
        .loading.show {
            display: block;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #8B0000;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        @media (max-width: 768px) {
            .log-container {
                padding: 20px;
            }
            .log-header {
                flex-direction: column;
                text-align: center;
            }
            .activity-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .activity-item .activity-time {
                text-align: left;
                width: 100%;
            }
            .filters {
                flex-direction: column;
            }
            .filters select,
            .filters input {
                min-width: auto;
            }
            .stat-card {
                min-width: 100px;
                padding: 12px 18px;
            }
            .stat-card .number {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="log-container">
        <div class="log-header">
            <h1><i class="fas fa-history"></i> Activity Log</h1>
            <a href="admin.html" class="back-btn">
                <i class="fas fa-arrow-left"></i> Back to Admin Panel
            </a>
        </div>

        <div class="log-stats">
            <div class="stat-card">
                <div class="number" id="totalCount">0</div>
                <div class="label">Total Activities</div>
            </div>
            <div class="stat-card">
                <div class="number" id="todayCount">0</div>
                <div class="label">Today</div>
            </div>
            <div class="stat-card">
                <div class="number" id="userCount">0</div>
                <div class="label">Active Admins</div>
            </div>
        </div>

        <div class="filters">
            <select id="filterPosition">
                <option value="">All Positions</option>
                <option value="Convener">Convener</option>
                <option value="Joint Convener">Joint Convener</option>
                <option value="Media Manager">Media Manager</option>
                <option value="Member Secretary">Member Secretary</option>
                <option value="Co-Ordinator">Co-Ordinator</option>
                <option value="Member">Member</option>
                <option value="Editor">Editor</option>
            </select>
            <input type="date" id="filterDate" />
            <button class="filter-btn" onclick="applyFilters()">
                <i class="fas fa-filter"></i> Apply Filters
            </button>
            <button class="clear-btn" onclick="clearFilters()">
                <i class="fas fa-times"></i> Clear
            </button>
            <button class="filter-btn" onclick="refreshLog()" style="background:#17a2b8;">
                <i class="fas fa-sync"></i> Refresh
            </button>
        </div>

        <div class="loading" id="loadingLog">
            <div class="spinner"></div>
            <p>Loading activities...</p>
        </div>
        <div class="activity-log-list" id="activityLogList">
            <div class="activity-empty">
                <i class="fas fa-inbox"></i>
                <p>No activities recorded yet</p>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js">
    </script>
    <script>
        const firebaseConfig = {
  apiKey: "AIzaSyAZqCBb6zuD3uzhUhE8Ccbeh66wIJpOMSM",
  authDomain: "kdr-anniversary.firebaseapp.com",
  projectId: "kdr-anniversary",
  storageBucket: "kdr-anniversary.firebasestorage.app",
  messagingSenderId: "744360884581",
  appId: "1:744360884581:web:2c51e2dd3b322288c2c98c"
};
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allActivities = [];

        async function loadActivityLog() {
            const list = document.getElementById('activityLogList');
            const loading = document.getElementById('loadingLog');
            loading.classList.add('show');
            list.innerHTML = '';

            try {
                const snapshot = await db.collection('activityLog')
                    .orderBy('timestamp', 'desc')
                    .limit(200)
                    .get();

                loading.classList.remove('show');

                if (snapshot.empty) {
                    list.innerHTML = `
                        <div class="activity-empty">
                            <i class="fas fa-inbox"></i>
                            <p>No activities recorded yet</p>
                        </div>
                    `;
                    allActivities = [];
                    updateStats([]);
                    return;
                }

                allActivities = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    data.id = doc.id;
                    allActivities.push(data);
                });

                updateStats(allActivities);
                renderActivities(allActivities);

            } catch (error) {
                console.error('Load activity error:', error);
                loading.classList.remove('show');
                list.innerHTML = `
                    <div class="activity-empty">
                        <i class="fas fa-exclamation-triangle" style="color:#f44336;"></i>
                        <p>Error loading activities: ${error.message}</p>
                    </div>
                `;
            }
        }

        function renderActivities(activities) {
            const list = document.getElementById('activityLogList');

            if (activities.length === 0) {
                list.innerHTML = `
                    <div class="activity-empty">
                        <i class="fas fa-inbox"></i>
                        <p>No activities match your filters</p>
                    </div>
                `;
                return;
            }

            let html = '';
            activities.forEach(data => {
                const time = data.timestamp ? data.timestamp.toDate().toLocaleString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                }) : 'Just now';
                html += `
                    <div class="activity-item">
                        <div class="activity-user">
                            <strong><i class="fas fa-user-circle" style="color:#8B0000;"></i> ${data.adminName || 'Unknown'}</strong>
                            <span class="position-badge">${data.adminPosition || 'N/A'}</span>
                        </div>
                        <span class="activity-action">${data.action || 'No action'}</span>
                        <span class="activity-time"><i class="far fa-clock"></i> ${time}</span>
                    </div>
                `;
            });
            list.innerHTML = html;
        }

        function updateStats(activities) {
            document.getElementById('totalCount').textContent = activities.length;

            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const todayActivities = activities.filter(data => {
                if (!data.timestamp) return false;
                const d = data.timestamp.toDate();
                d.setHours(0, 0, 0, 0);
                return d.getTime() === today.getTime();
            });
            document.getElementById('todayCount').textContent = todayActivities.length;

            const uniqueUsers = new Set(activities.map(d => d.adminEmail || d.adminName || ''));
            document.getElementById('userCount').textContent = uniqueUsers.size;
        }

        function applyFilters() {
            const positionFilter = document.getElementById('filterPosition').value;
            const dateFilter = document.getElementById('filterDate').value;

            let filtered = allActivities;

            if (positionFilter) {
                filtered = filtered.filter(data => data.adminPosition === positionFilter);
            }

            if (dateFilter) {
                const filterDate = new Date(dateFilter);
                filterDate.setHours(0, 0, 0, 0);
                const nextDay = new Date(filterDate);
                nextDay.setDate(nextDay.getDate() + 1);

                filtered = filtered.filter(data => {
                    if (!data.timestamp) return false;
                    const d = data.timestamp.toDate();
                    return d >= filterDate && d < nextDay;
                });
            }

            renderActivities(filtered);
            updateStats(filtered);
        }

        function clearFilters() {
            document.getElementById('filterPosition').value = '';
            document.getElementById('filterDate').value = '';
            renderActivities(allActivities);
            updateStats(allActivities);
        }

        function refreshLog() {
            loadActivityLog();
        }

        // Auto-refresh every 30 seconds
        let refreshInterval = setInterval(() => {
            loadActivityLog();
        }, 30000);

        // Load on page load
        document.addEventListener('DOMContentLoaded', loadActivityLog);

        // Cleanup interval on page unload
        window.addEventListener('beforeunload', function() {
            clearInterval(refreshInterval);
        });
    </script>
</body>
</html>
