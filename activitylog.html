<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activity Log - Kishoreganj District Rover</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #8B0000 0%, #CC0000 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .log-container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }
        .log-header h1 {
            color: #333;
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .log-header h1 i {
            color: #8B0000;
        }
        .log-header .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .back-btn {
            padding: 12px 24px;
            background: #8B0000;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
            text-decoration: none;
        }
        .back-btn:hover {
            background: #CC0000;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(139, 0, 0, 0.3);
        }
        .delete-all-btn {
            padding: 12px 24px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            display: none;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
        }
        .delete-all-btn:hover {
            background: #c82333;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(220, 53, 69, 0.3);
        }
        .delete-all-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .delete-all-btn.show {
            display: flex;
        }
        .log-stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .stat-card {
            background: #f8f9fa;
            padding: 15px 25px;
            border-radius: 12px;
            border-left: 4px solid #8B0000;
            flex: 1;
            min-width: 150px;
        }
        .stat-card .number {
            font-size: 28px;
            font-weight: 700;
            color: #8B0000;
        }
        .stat-card .label {
            font-size: 14px;
            color: #666;
            margin-top: 4px;
        }
        .filters {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
        }
        .filters select,
        .filters input {
            padding: 8px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            flex: 1;
            min-width: 150px;
        }
        .filters select:focus,
        .filters input:focus {
            border-color: #8B0000;
            outline: none;
        }
        .filters .filter-btn {
            padding: 8px 20px;
            background: #8B0000;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .filters .filter-btn:hover {
            background: #CC0000;
        }
        .filters .clear-btn {
            padding: 8px 20px;
            background: #e0e0e0;
            color: #333;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .filters .clear-btn:hover {
            background: #cccccc;
        }
        .activity-log-list {
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            background: #fafafa;
        }
        .activity-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            transition: background 0.2s;
        }
        .activity-item:hover {
            background: #f0f0f0;
        }
        .activity-item:last-child {
            border-bottom: none;
        }
        .activity-item .activity-user {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            min-width: 200px;
        }
        .activity-item .activity-user strong {
            color: #8B0000;
        }
        .activity-item .activity-user .position-badge {
            background: #e8f0fe;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 11px;
            color: #1a73e8;
        }
        .activity-item .activity-action {
            color: #333;
            flex: 1;
            padding: 0 15px;
        }
        .activity-item .activity-time {
            color: #999;
            font-size: 12px;
            white-space: nowrap;
            min-width: 120px;
            text-align: right;
        }
        .activity-empty {
            text-align: center;
            padding: 50px 20px;
            color: #999;
        }
        .activity-empty i {
            font-size: 48px;
            margin-bottom: 15px;
            color: #ddd;
        }
        .loading {
            text-align: center;
            padding: 50px 20px;
            display: none;
        }
        .loading.show {
            display: block;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #8B0000;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        /* ---------- STATUS MESSAGE ---------- */
        .status-message {
            padding: 12px 18px;
            border-radius: 8px;
            margin: 15px 0;
            display: none;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }
        .status-message.show {
            display: flex;
        }
        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status-message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        /* ---------- DELETE CONFIRM MODAL ---------- */
        .confirm-modal {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .confirm-modal-content {
            background: white;
            max-width: 450px;
            width: 95%;
            margin: 100px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideDown 0.3s ease;
            text-align: center;
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .confirm-modal-content h3 {
            color: #333;
            font-size: 22px;
            margin-bottom: 10px;
        }
        .confirm-modal-content p {
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .confirm-modal-content .warning-icon {
            font-size: 60px;
            color: #dc3545;
            margin-bottom: 15px;
        }
        .confirm-modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .confirm-modal-actions button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .confirm-modal-actions .btn-confirm-delete {
            background: #dc3545;
            color: white;
        }
        .confirm-modal-actions .btn-confirm-delete:hover {
            background: #c82333;
            transform: translateY(-2px);
        }
        .confirm-modal-actions .btn-confirm-delete:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
        }
        .confirm-modal-actions .btn-cancel-delete {
            background: #e0e0e0;
            color: #333;
        }
        .confirm-modal-actions .btn-cancel-delete:hover {
            background: #cccccc;
        }

        @media (max-width: 768px) {
            .log-container {
                padding: 20px;
            }
            .log-header {
                flex-direction: column;
                text-align: center;
            }
            .log-header .header-actions {
                flex-direction: column;
                width: 100%;
            }
            .log-header .header-actions .back-btn,
            .log-header .header-actions .delete-all-btn {
                width: 100%;
                justify-content: center;
            }
            .activity-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .activity-item .activity-time {
                text-align: left;
                width: 100%;
            }
            .filters {
                flex-direction: column;
            }
            .filters select,
            .filters input {
                min-width: auto;
            }
            .stat-card {
                min-width: 100px;
                padding: 12px 18px;
            }
            .stat-card .number {
                font-size: 22px;
            }
            .confirm-modal-content {
                margin: 40px auto;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="log-container">
        <div class="log-header">
            <h1><i class="fas fa-history"></i> Activity Log</h1>
            <div class="header-actions">
                <button class="delete-all-btn" id="deleteAllBtn" onclick="openDeleteConfirmModal()">
                    <i class="fas fa-trash-alt"></i> Delete All Activities
                </button>
                <a href="admin.html" class="back-btn">
                    <i class="fas fa-arrow-left"></i> Back to Admin Panel
                </a>
            </div>
        </div>

        <div class="log-stats">
            <div class="stat-card">
                <div class="number" id="totalCount">0</div>
                <div class="label">Total Activities</div>
            </div>
            <div class="stat-card">
                <div class="number" id="todayCount">0</div>
                <div class="label">Today</div>
            </div>
            <div class="stat-card">
                <div class="number" id="userCount">0</div>
                <div class="label">Active Admins</div>
            </div>
        </div>

        <div id="statusMessage" class="status-message"></div>

        <div class="filters">
            <select id="filterPosition">
                <option value="">All Positions</option>
                <option value="Convener">Convener</option>
                <option value="Joint Convener">Joint Convener</option>
                <option value="Media Manager">Media Manager</option>
                <option value="Member Secretary">Member Secretary</option>
                <option value="Co-Ordinator">Co-Ordinator</option>
                <option value="Member">Member</option>
                <option value="Editor">Editor</option>
            </select>
            <input type="date" id="filterDate" />
            <button class="filter-btn" onclick="applyFilters()">
                <i class="fas fa-filter"></i> Apply Filters
            </button>
            <button class="clear-btn" onclick="clearFilters()">
                <i class="fas fa-times"></i> Clear
            </button>
            <button class="filter-btn" onclick="refreshLog()" style="background:#17a2b8;">
                <i class="fas fa-sync"></i> Refresh
            </button>
        </div>

        <div class="loading" id="loadingLog">
            <div class="spinner"></div>
            <p>Loading activities...</p>
        </div>
        <div class="activity-log-list" id="activityLogList">
            <div class="activity-empty">
                <i class="fas fa-inbox"></i>
                <p>No activities recorded yet</p>
            </div>
        </div>
    </div>

    <!-- ========== DELETE CONFIRM MODAL ========== -->
    <div class="confirm-modal" id="deleteConfirmModal">
        <div class="confirm-modal-content">
            <div class="warning-icon">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h3>⚠️ Delete All Activities?</h3>
            <p>
                This action will permanently delete <strong>all</strong> activity logs from the database.
                <br><br>
                <span style="color:#dc3545; font-weight:600;">This action cannot be undone!</span>
            </p>
            <div class="confirm-modal-actions">
                <button class="btn-confirm-delete" id="confirmDeleteBtn" onclick="confirmDeleteAll()">
                    <i class="fas fa-trash-alt"></i> Yes, Delete All
                </button>
                <button class="btn-cancel-delete" onclick="closeDeleteConfirmModal()">
                    <i class="fas fa-times"></i> Cancel
                </button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js">
    </script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAZqCBb6zuD3uzhUhE8Ccbeh66wIJpOMSM",
            authDomain: "kdr-anniversary.firebaseapp.com",
            projectId: "kdr-anniversary",
            storageBucket: "kdr-anniversary.firebasestorage.app",
            messagingSenderId: "744360884581",
            appId: "1:744360884581:web:2c51e2dd3b322288c2c98c"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let allActivities = [];
        let currentUser = null;
        let isSuperAdmin = false;

        // ============================================================
        //  CHECK AUTH STATUS
        // ============================================================
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                try {
                    const doc = await db.collection('adminUsers').doc(user.uid).get();
                    if (doc.exists) {
                        const data = doc.data();
                        isSuperAdmin = data.isSuperAdmin || false;
                        // Show Delete All button only for Super Admin
                        if (isSuperAdmin) {
                            document.getElementById('deleteAllBtn').classList.add('show');
                        } else {
                            document.getElementById('deleteAllBtn').classList.remove('show');
                        }
                        loadActivityLog();
                    } else {
                        // Not an admin, redirect
                        window.location.href = 'admin.html';
                    }
                } catch (e) {
                    console.error('Auth check error:', e);
                    window.location.href = 'admin.html';
                }
            } else {
                // Not logged in, redirect to login
                window.location.href = 'admin.html';
            }
        });

        // ============================================================
        //  LOAD ACTIVITY LOG
        // ============================================================
        async function loadActivityLog() {
            const list = document.getElementById('activityLogList');
            const loading = document.getElementById('loadingLog');
            loading.classList.add('show');
            list.innerHTML = '';

            try {
                const snapshot = await db.collection('activityLog')
                    .orderBy('timestamp', 'desc')
                    .limit(500)
                    .get();

                loading.classList.remove('show');

                if (snapshot.empty) {
                    list.innerHTML = `
                        <div class="activity-empty">
                            <i class="fas fa-inbox"></i>
                            <p>No activities recorded yet</p>
                        </div>
                    `;
                    allActivities = [];
                    updateStats([]);
                    return;
                }

                allActivities = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    data.id = doc.id;
                    allActivities.push(data);
                });

                updateStats(allActivities);
                renderActivities(allActivities);

            } catch (error) {
                console.error('Load activity error:', error);
                loading.classList.remove('show');
                list.innerHTML = `
                    <div class="activity-empty">
                        <i class="fas fa-exclamation-triangle" style="color:#f44336;"></i>
                        <p>Error loading activities: ${error.message}</p>
                    </div>
                `;
            }
        }

        // ============================================================
        //  RENDER ACTIVITIES
        // ============================================================
        function renderActivities(activities) {
            const list = document.getElementById('activityLogList');

            if (activities.length === 0) {
                list.innerHTML = `
                    <div class="activity-empty">
                        <i class="fas fa-inbox"></i>
                        <p>No activities match your filters</p>
                    </div>
                `;
                return;
            }

            let html = '';
            activities.forEach(data => {
                const time = data.timestamp ? data.timestamp.toDate().toLocaleString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                }) : 'Just now';
                html += `
                    <div class="activity-item">
                        <div class="activity-user">
                            <strong><i class="fas fa-user-circle" style="color:#8B0000;"></i> ${data.adminName || 'Unknown'}</strong>
                            <span class="position-badge">${data.adminPosition || 'N/A'}</span>
                        </div>
                        <span class="activity-action">${data.action || 'No action'}</span>
                        <span class="activity-time"><i class="far fa-clock"></i> ${time}</span>
                    </div>
                `;
            });
            list.innerHTML = html;
        }

        // ============================================================
        //  UPDATE STATS
        // ============================================================
        function updateStats(activities) {
            document.getElementById('totalCount').textContent = activities.length;

            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const todayActivities = activities.filter(data => {
                if (!data.timestamp) return false;
                const d = data.timestamp.toDate();
                d.setHours(0, 0, 0, 0);
                return d.getTime() === today.getTime();
            });
            document.getElementById('todayCount').textContent = todayActivities.length;

            const uniqueUsers = new Set(activities.map(d => d.adminEmail || d.adminName || ''));
            document.getElementById('userCount').textContent = uniqueUsers.size;
        }

        // ============================================================
        //  FILTERS
        // ============================================================
        function applyFilters() {
            const positionFilter = document.getElementById('filterPosition').value;
            const dateFilter = document.getElementById('filterDate').value;

            let filtered = allActivities;

            if (positionFilter) {
                filtered = filtered.filter(data => data.adminPosition === positionFilter);
            }

            if (dateFilter) {
                const filterDate = new Date(dateFilter);
                filterDate.setHours(0, 0, 0, 0);
                const nextDay = new Date(filterDate);
                nextDay.setDate(nextDay.getDate() + 1);

                filtered = filtered.filter(data => {
                    if (!data.timestamp) return false;
                    const d = data.timestamp.toDate();
                    return d >= filterDate && d < nextDay;
                });
            }

            renderActivities(filtered);
            updateStats(filtered);
        }

        function clearFilters() {
            document.getElementById('filterPosition').value = '';
            document.getElementById('filterDate').value = '';
            renderActivities(allActivities);
            updateStats(allActivities);
        }

        function refreshLog() {
            loadActivityLog();
        }

        // ============================================================
        //  DELETE ALL ACTIVITIES (Super Admin Only)
        // ============================================================
        function openDeleteConfirmModal() {
            if (!isSuperAdmin) {
                showStatusMessage('❌ Only Super Admin can delete activities!', 'error');
                return;
            }
            document.getElementById('deleteConfirmModal').style.display = 'block';
        }

        function closeDeleteConfirmModal() {
            document.getElementById('deleteConfirmModal').style.display = 'none';
            document.getElementById('confirmDeleteBtn').disabled = false;
            document.getElementById('confirmDeleteBtn').innerHTML = '<i class="fas fa-trash-alt"></i> Yes, Delete All';
        }

        async function confirmDeleteAll() {
            const btn = document.getElementById('confirmDeleteBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Deleting...';

            try {
                // Get all activity documents
                const snapshot = await db.collection('activityLog')
                    .orderBy('timestamp', 'desc')
                    .get();

                if (snapshot.empty) {
                    showStatusMessage('No activities to delete.', 'info');
                    closeDeleteConfirmModal();
                    return;
                }

                // Delete each document in batches
                let deletedCount = 0;
                const batchSize = 20;
                let batch = db.batch();
                let count = 0;

                for (const doc of snapshot.docs) {
                    batch.delete(doc.ref);
                    count++;
                    deletedCount++;

                    if (count === batchSize) {
                        await batch.commit();
                        batch = db.batch();
                        count = 0;
                    }
                }

                if (count > 0) {
                    await batch.commit();
                }

                // Log this action
                await db.collection('activityLog').add({
                    adminName: currentUser.email || 'Super Admin',
                    adminPosition: 'Super Admin',
                    adminEmail: currentUser.email,
                    action: `🗑️ Deleted all activity logs (${deletedCount} entries)`,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                showStatusMessage(`✅ Successfully deleted ${deletedCount} activity entries!`, 'success');
                closeDeleteConfirmModal();

                // Reload the log
                loadActivityLog();

            } catch (error) {
                console.error('Delete all error:', error);
                showStatusMessage('❌ Error deleting activities: ' + error.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-trash-alt"></i> Yes, Delete All';
            }
        }

        // ============================================================
        //  STATUS MESSAGE
        // ============================================================
        function showStatusMessage(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.className = 'status-message ' + type + ' show';
            setTimeout(() => {
                statusDiv.classList.remove('show');
            }, 5000);
        }

        // ============================================================
        //  AUTO-REFRESH
        // ============================================================
        let refreshInterval = setInterval(() => {
            if (document.getElementById('activityLogList').children.length > 0) {
                loadActivityLog();
            }
        }, 30000);

        document.addEventListener('DOMContentLoaded', function() {
            // Load will be triggered by auth state change
        });

        window.addEventListener('beforeunload', function() {
            clearInterval(refreshInterval);
        });

        // Click outside modal to close
        window.onclick = function(e) {
            const modal = document.getElementById('deleteConfirmModal');
            if (e.target === modal) closeDeleteConfirmModal();
        };
    </script>
</body>
</html>
