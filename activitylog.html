<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activity Log - Kishoreganj District Rover</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #8B0000 0%, #CC0000 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .log-container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }
        .log-header h1 {
            color: #333;
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .log-header h1 i {
            color: #8B0000;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .back-btn {
            padding: 12px 24px;
            background: #8B0000;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
            text-decoration: none;
        }
        .back-btn:hover {
            background: #CC0000;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(139, 0, 0, 0.3);
        }
        .btn-danger {
            padding: 12px 24px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
        }
        .btn-danger:hover {
            background: #da190b;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(244, 67, 54, 0.3);
        }
        .btn-danger:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-success {
            padding: 12px 24px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
        }
        .btn-success:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(40, 167, 69, 0.3);
        }
        .btn-info {
            padding: 12px 24px;
            background: #17a2b8;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
        }
        .btn-info:hover {
            background: #138496;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(23, 162, 184, 0.3);
        }
        .log-stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .stat-card {
            background: #f8f9fa;
            padding: 15px 25px;
            border-radius: 12px;
            border-left: 4px solid #8B0000;
            flex: 1;
            min-width: 150px;
        }
        .stat-card .number {
            font-size: 28px;
            font-weight: 700;
            color: #8B0000;
        }
        .stat-card .label {
            font-size: 14px;
            color: #666;
            margin-top: 4px;
        }
        .filters {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
            align-items: center;
        }
        .filters select,
        .filters input {
            padding: 8px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            flex: 1;
            min-width: 150px;
        }
        .filters select:focus,
        .filters input:focus {
            border-color: #8B0000;
            outline: none;
        }
        .filters .filter-btn {
            padding: 8px 20px;
            background: #8B0000;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .filters .filter-btn:hover {
            background: #CC0000;
        }
        .filters .clear-btn {
            padding: 8px 20px;
            background: #e0e0e0;
            color: #333;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .filters .clear-btn:hover {
            background: #cccccc;
        }
        .export-dropdown {
            position: relative;
            display: inline-block;
        }
        .export-dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background: white;
            min-width: 200px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            border-radius: 10px;
            z-index: 10;
            overflow: hidden;
        }
        .export-dropdown-content.show {
            display: block;
        }
        .export-dropdown-content button {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            border: none;
            background: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            width: 100%;
            text-align: left;
            transition: background 0.2s;
        }
        .export-dropdown-content button:hover {
            background: #f0f0f0;
        }
        .export-dropdown-content button i {
            width: 20px;
            color: #8B0000;
        }
        .activity-log-list {
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            background: #fafafa;
        }
        .activity-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            transition: background 0.2s;
        }
        .activity-item:hover {
            background: #f0f0f0;
        }
        .activity-item:last-child {
            border-bottom: none;
        }
        .activity-item .activity-user {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            min-width: 200px;
        }
        .activity-item .activity-user strong {
            color: #8B0000;
        }
        .activity-item .activity-user .position-badge {
            background: #e8f0fe;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 11px;
            color: #1a73e8;
        }
        .activity-item .activity-action {
            color: #333;
            flex: 1;
            padding: 0 15px;
        }
        .activity-item .activity-time {
            color: #999;
            font-size: 12px;
            white-space: nowrap;
            min-width: 120px;
            text-align: right;
        }
        .activity-empty {
            text-align: center;
            padding: 50px 20px;
            color: #999;
        }
        .activity-empty i {
            font-size: 48px;
            margin-bottom: 15px;
            color: #ddd;
        }
        .loading {
            text-align: center;
            padding: 50px 20px;
            display: none;
        }
        .loading.show {
            display: block;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #8B0000;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #333;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            display: none;
            align-items: center;
            gap: 12px;
            z-index: 9999;
            max-width: 400px;
            animation: slideUp 0.3s ease;
        }
        .toast.show {
            display: flex;
        }
        .toast.success {
            background: #28a745;
        }
        .toast.error {
            background: #f44336;
        }
        .toast.info {
            background: #17a2b8;
        }
        .toast i {
            font-size: 20px;
        }
        @media (max-width: 768px) {
            .log-container {
                padding: 20px;
            }
            .log-header {
                flex-direction: column;
                text-align: center;
            }
            .header-actions {
                width: 100%;
                flex-direction: column;
            }
            .header-actions button,
            .header-actions a {
                width: 100%;
                justify-content: center;
            }
            .activity-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .activity-item .activity-time {
                text-align: left;
                width: 100%;
            }
            .filters {
                flex-direction: column;
            }
            .filters select,
            .filters input {
                min-width: auto;
            }
            .stat-card {
                min-width: 100px;
                padding: 12px 18px;
            }
            .stat-card .number {
                font-size: 22px;
            }
            .export-dropdown-content {
                right: 0;
                left: 0;
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="log-container">
        <div class="log-header">
            <h1><i class="fas fa-history"></i> Activity Log</h1>
            <div class="header-actions">
                <div class="export-dropdown">
                    <button class="btn-success" onclick="toggleExportDropdown()">
                        <i class="fas fa-file-export"></i> Export
                    </button>
                    <div class="export-dropdown-content" id="exportDropdown">
                        <button onclick="exportCSV('all')">
                            <i class="fas fa-file-csv"></i> Export All as CSV
                        </button>
                        <button onclick="exportCSV('filtered')">
                            <i class="fas fa-file-csv"></i> Export Filtered as CSV
                        </button>
                        <button onclick="exportXLSX('all')">
                            <i class="fas fa-file-excel"></i> Export All as XLSX
                        </button>
                        <button onclick="exportXLSX('filtered')">
                            <i class="fas fa-file-excel"></i> Export Filtered as XLSX
                        </button>
                    </div>
                </div>
                <button class="btn-danger" id="deleteAllBtn" onclick="deleteAllActivities()" style="display:none;">
                    <i class="fas fa-trash-alt"></i> Delete All
                </button>
                <a href="admin-anniversary.html" class="back-btn">
                    <i class="fas fa-arrow-left"></i> Back
                </a>
            </div>
        </div>

        <div class="log-stats">
            <div class="stat-card">
                <div class="number" id="totalCount">0</div>
                <div class="label">Total Activities</div>
            </div>
            <div class="stat-card">
                <div class="number" id="todayCount">0</div>
                <div class="label">Today</div>
            </div>
            <div class="stat-card">
                <div class="number" id="userCount">0</div>
                <div class="label">Active Admins</div>
            </div>
        </div>

        <div class="filters">
            <select id="filterPosition">
                <option value="">All Positions</option>
                <option value="Convener">Convener</option>
                <option value="Joint Convener">Joint Convener</option>
                <option value="Media Manager">Media Manager</option>
                <option value="Member Secretary">Member Secretary</option>
                <option value="Co-Ordinator">Co-Ordinator</option>
                <option value="Member">Member</option>
                <option value="Editor">Editor</option>
            </select>
            <select id="filterAdmin">
                <option value="">All Admins</option>
            </select>
            <input type="date" id="filterDate" />
            <button class="filter-btn" onclick="applyFilters()">
                <i class="fas fa-filter"></i> Apply Filters
            </button>
            <button class="clear-btn" onclick="clearFilters()">
                <i class="fas fa-times"></i> Clear
            </button>
            <button class="filter-btn" onclick="refreshLog()" style="background:#17a2b8;">
                <i class="fas fa-sync"></i> Refresh
            </button>
        </div>

        <div class="loading" id="loadingLog">
            <div class="spinner"></div>
            <p>Loading activities...</p>
        </div>
        <div class="activity-log-list" id="activityLogList">
            <div class="activity-empty">
                <i class="fas fa-inbox"></i>
                <p>No activities recorded yet</p>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle" id="toastIcon"></i>
        <span id="toastMessage">Success!</span>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js">
    </script>
    <!-- SheetJS for XLSX export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">
    </script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAZqCBb6zuD3uzhUhE8Ccbeh66wIJpOMSM",
            authDomain: "kdr-anniversary.firebaseapp.com",
            projectId: "kdr-anniversary",
            storageBucket: "kdr-anniversary.firebasestorage.app",
            messagingSenderId: "744360884581",
            appId: "1:744360884581:web:2c51e2dd3b322288c2c98c"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let allActivities = [];
        let isSuperAdmin = false;
        let currentUserEmail = '';

        // ============================================================
        //  AUTH CHECK
        // ============================================================
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUserEmail = user.email;
                try {
                    const doc = await db.collection('adminUsers').doc(user.uid).get();
                    if (doc.exists) {
                        const data = doc.data();
                        isSuperAdmin = data.isSuperAdmin || false;
                        if (isSuperAdmin) {
                            document.getElementById('deleteAllBtn').style.display = 'flex';
                        }
                        loadActivityLog();
                        loadAdminList();
                    } else {
                        showToast('Unauthorized access!', 'error');
                        window.location.href = 'admin-anniversary.html';
                    }
                } catch (e) {
                    console.error('Auth check error:', e);
                }
            } else {
                window.location.href = 'admin-anniversary.html';
            }
        });

        // ============================================================
        //  LOAD ACTIVITY LOG
        // ============================================================
        async function loadActivityLog() {
            const list = document.getElementById('activityLogList');
            const loading = document.getElementById('loadingLog');
            loading.classList.add('show');
            list.innerHTML = '';

            try {
                const snapshot = await db.collection('activityLog')
                    .orderBy('timestamp', 'desc')
                    .limit(500)
                    .get();

                loading.classList.remove('show');

                if (snapshot.empty) {
                    list.innerHTML = `
                        <div class="activity-empty">
                            <i class="fas fa-inbox"></i>
                            <p>No activities recorded yet</p>
                        </div>
                    `;
                    allActivities = [];
                    updateStats([]);
                    return;
                }

                allActivities = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    data.id = doc.id;
                    allActivities.push(data);
                });

                updateStats(allActivities);
                renderActivities(allActivities);

            } catch (error) {
                console.error('Load activity error:', error);
                loading.classList.remove('show');
                list.innerHTML = `
                    <div class="activity-empty">
                        <i class="fas fa-exclamation-triangle" style="color:#f44336;"></i>
                        <p>Error loading activities: ${error.message}</p>
                    </div>
                `;
            }
        }

        // ============================================================
        //  LOAD ADMIN LIST FOR FILTER
        // ============================================================
        async function loadAdminList() {
            try {
                const snapshot = await db.collection('adminUsers').get();
                const select = document.getElementById('filterAdmin');
                const admins = new Set();
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.name && data.email) {
                        admins.add(JSON.stringify({ name: data.name, email: data.email }));
                    }
                });
                admins.forEach(admin => {
                    const { name, email } = JSON.parse(admin);
                    const option = document.createElement('option');
                    option.value = email;
                    option.textContent = `${name} (${email})`;
                    select.appendChild(option);
                });
            } catch (e) {
                console.error('Load admin list error:', e);
            }
        }

        // ============================================================
        //  RENDER FUNCTIONS
        // ============================================================
        function renderActivities(activities) {
            const list = document.getElementById('activityLogList');

            if (activities.length === 0) {
                list.innerHTML = `
                    <div class="activity-empty">
                        <i class="fas fa-inbox"></i>
                        <p>No activities match your filters</p>
                    </div>
                `;
                return;
            }

            let html = '';
            activities.forEach(data => {
                const time = data.timestamp ? data.timestamp.toDate().toLocaleString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                }) : 'Just now';
                html += `
                    <div class="activity-item">
                        <div class="activity-user">
                            <strong><i class="fas fa-user-circle" style="color:#8B0000;"></i> ${data.adminName || 'Unknown'}</strong>
                            <span class="position-badge">${data.adminPosition || 'N/A'}</span>
                        </div>
                        <span class="activity-action">${data.action || 'No action'}</span>
                        <span class="activity-time"><i class="far fa-clock"></i> ${time}</span>
                    </div>
                `;
            });
            list.innerHTML = html;
        }

        function updateStats(activities) {
            document.getElementById('totalCount').textContent = activities.length;

            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const todayActivities = activities.filter(data => {
                if (!data.timestamp) return false;
                const d = data.timestamp.toDate();
                d.setHours(0, 0, 0, 0);
                return d.getTime() === today.getTime();
            });
            document.getElementById('todayCount').textContent = todayActivities.length;

            const uniqueUsers = new Set(activities.map(d => d.adminEmail || d.adminName || ''));
            document.getElementById('userCount').textContent = uniqueUsers.size;
        }

        function getFilteredActivities() {
            const positionFilter = document.getElementById('filterPosition').value;
            const adminFilter = document.getElementById('filterAdmin').value;
            const dateFilter = document.getElementById('filterDate').value;

            let filtered = allActivities;

            if (positionFilter) {
                filtered = filtered.filter(data => data.adminPosition === positionFilter);
            }

            if (adminFilter) {
                filtered = filtered.filter(data => data.adminEmail === adminFilter);
            }

            if (dateFilter) {
                const filterDate = new Date(dateFilter);
                filterDate.setHours(0, 0, 0, 0);
                const nextDay = new Date(filterDate);
                nextDay.setDate(nextDay.getDate() + 1);

                filtered = filtered.filter(data => {
                    if (!data.timestamp) return false;
                    const d = data.timestamp.toDate();
                    return d >= filterDate && d < nextDay;
                });
            }

            return filtered;
        }

        // ============================================================
        //  FILTERS
        // ============================================================
        function applyFilters() {
            const filtered = getFilteredActivities();
            renderActivities(filtered);
            updateStats(filtered);
        }

        function clearFilters() {
            document.getElementById('filterPosition').value = '';
            document.getElementById('filterAdmin').value = '';
            document.getElementById('filterDate').value = '';
            renderActivities(allActivities);
            updateStats(allActivities);
        }

        function refreshLog() {
            loadActivityLog();
        }

        // ============================================================
        //  DELETE ALL ACTIVITIES (Super Admin only)
        // ============================================================
        async function deleteAllActivities() {
            if (!isSuperAdmin) {
                showToast('Only Super Admin can delete activities!', 'error');
                return;
            }

            if (allActivities.length === 0) {
                showToast('No activities to delete.', 'info');
                return;
            }

            if (!confirm('⚠️ Are you sure you want to delete ALL activities? This action cannot be undone!')) {
                return;
            }

            const btn = document.getElementById('deleteAllBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Deleting...';

            try {
                const batchSize = 20;
                const total = allActivities.length;
                let deleted = 0;

                for (let i = 0; i < allActivities.length; i += batchSize) {
                    const batch = db.batch();
                    const chunk = allActivities.slice(i, i + batchSize);
                    chunk.forEach(activity => {
                        if (activity.id) {
                            const ref = db.collection('activityLog').doc(activity.id);
                            batch.delete(ref);
                        }
                    });
                    await batch.commit();
                    deleted += chunk.length;
                    showToast(`Deleting ${deleted}/${total} activities...`, 'info');
                }

                // Log the deletion
                await db.collection('activityLog').add({
                    adminName: 'System',
                    adminPosition: 'Super Admin',
                    adminEmail: currentUserEmail,
                    action: `Deleted ALL ${deleted} activities`,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                showToast(`✅ Successfully deleted ${deleted} activities!`, 'success');
                loadActivityLog();

            } catch (error) {
                console.error('Delete error:', error);
                showToast('❌ Error deleting activities: ' + error.message, 'error');
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-trash-alt"></i> Delete All';
        }

        // ============================================================
        //  EXPORT FUNCTIONS
        // ============================================================
        function toggleExportDropdown() {
            const dropdown = document.getElementById('exportDropdown');
            dropdown.classList.toggle('show');
        }

        // Close dropdown on outside click
        document.addEventListener('click', function(e) {
            const dropdown = document.getElementById('exportDropdown');
            const btn = e.target.closest('.export-dropdown');
            if (!btn) {
                dropdown.classList.remove('show');
            }
        });

        function getExportData(type) {
            let data;
            if (type === 'all') {
                data = allActivities;
            } else {
                data = getFilteredActivities();
            }

            return data.map(activity => ({
                'Admin Name': activity.adminName || 'Unknown',
                'Position': activity.adminPosition || 'N/A',
                'Email': activity.adminEmail || 'N/A',
                'Action': activity.action || 'No action',
                'Timestamp': activity.timestamp ? activity.timestamp.toDate().toLocaleString() : 'N/A'
            }));
        }

        function exportCSV(type) {
            const data = getExportData(type);
            if (data.length === 0) {
                showToast('No data to export!', 'error');
                return;
            }

            const headers = Object.keys(data[0]);
            const rows = [headers.join(',')];

            data.forEach(row => {
                const values = headers.map(header => {
                    let value = row[header] || '';
                    if (typeof value === 'string' && (value.includes(',') || value.includes('"') || value.includes(
                            '\n'))) {
                        value = `"${value.replace(/"/g, '""')}"`;
                    }
                    return value;
                });
                rows.push(values.join(','));
            });

            const csv = rows.join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `activity_log_${type}_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            showToast(`✅ Exported ${data.length} activities as CSV`, 'success');
            document.getElementById('exportDropdown').classList.remove('show');
        }

        function exportXLSX(type) {
            const data = getExportData(type);
            if (data.length === 0) {
                showToast('No data to export!', 'error');
                return;
            }

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(data);

            // Auto column widths
            const colWidths = [];
            const headers = Object.keys(data[0]);
            headers.forEach(key => {
                let maxLen = key.length;
                data.forEach(row => {
                    const val = String(row[key] || '');
                    if (val.length > maxLen) maxLen = val.length;
                });
                colWidths.push({ wch: Math.min(Math.max(maxLen + 2, 12), 40) });
            });
            ws['!cols'] = colWidths;

            XLSX.utils.book_append_sheet(wb, ws, 'Activity Log');
            const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });

            const blob = new Blob([wbout], { type: 'application/octet-stream' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `activity_log_${type}_${new Date().toISOString().split('T')[0]}.xlsx`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            showToast(`✅ Exported ${data.length} activities as XLSX`, 'success');
            document.getElementById('exportDropdown').classList.remove('show');
        }

        // ============================================================
        //  TOAST NOTIFICATION
        // ============================================================
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const msg = document.getElementById('toastMessage');

            toast.className = 'toast ' + type + ' show';
            msg.textContent = message;

            switch (type) {
                case 'success':
                    icon.className = 'fas fa-check-circle';
                    break;
                case 'error':
                    icon.className = 'fas fa-exclamation-circle';
                    break;
                default:
                    icon.className = 'fas fa-info-circle';
            }

            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        // Auto-refresh every 60 seconds
        let refreshInterval = setInterval(() => {
            loadActivityLog();
        }, 60000);

        window.addEventListener('beforeunload', function() {
            clearInterval(refreshInterval);
        });
    </script>
</body>
</html>
